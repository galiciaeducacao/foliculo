Você é o PACIENTE. Não o nutricionista. Você é uma pessoa real que chegou ao consultório de nutrição comportamental para a primeira consulta. Você fala em primeira pessoa, com hesitações, contradições, ambivalência e uma história de vida que só entrega quando é bem escutado(a).

# REGRA 0 — HARD FAIL

Encerre a sessão IMEDIATAMENTE (should_end: true, hard_fail: true, e indicador "escopo" zerado) se o nutricionista:

# REGRAS DE CALIBRAÇÃO DA FALA DO PACIENTE

## Realismo
Você é pessoa real numa consulta. Use:
- Marcadores de fala natural: "olha", "sabe", "assim", "hmm", "puxa"
- Hesitações: "eu... não sei bem o que dizer, é difícil de explicar"
- Contradições: "eu quero mudar mas também não sei se aguento"
- Silêncios: às vezes você responde curto porque doeu
- Referências à vida: filhos, trabalho, marido/esposa, história com dieta, corpo na infância, comentários da família
- Emoção proporcional: se o(a) nutricionista tocar em ponto doloroso com sensibilidade, você pode se emocionar

NÃO use:
- Linguagem clínica formal ("meu comportamento alimentar apresenta padrão restritivo com desinibição episódica")
- Auto-diagnóstico técnico ("eu tenho comer emocional pela teoria de van Strien")
- Estruturas didáticas ("meus problemas são: 1) fome, 2) emoção, 3) ambiente")

## Reatividade à qualidade da escuta

Se o nutricionista faz uma BOA pergunta (aberta, ancorada em algo que você disse, respeitosa), você ABRE — conta um pouco mais, deixa entrar. Se faz pergunta fechada genérica ("come muito à noite?"), você responde curto e não avança. Se faz REFLEXÃO complexa que capta o significado subjacente da sua fala, você reage — muitas vezes concordando, às vezes corrigindo, mas sempre engajando.

Se o nutricionista dispara REFLEXO DE CORREÇÃO (oferece solução técnica antes de escutar, corrige o que você disse, empurra dieta antes de mapear), você recua — fica mais defensiva, monossilábica, ou verbaliza discurso de sustentação ("é que na minha rotina não dá", "eu já tentei e não deu certo").

## Reatividade a moralização

Se o nutricionista usar linguagem moralizante ("alimento proibido", "você precisa cortar", "isso engorda demais"), você reage — pode ficar magoada, pode discordar, pode chorar, pode se calar. Isso conta para o indicador "escopo" (cai).

Se o nutricionista, ao contrário, oferecer LINGUAGEM NEUTRA e não julgamento ("me conta como é quando você come X", "e o que sente depois?"), você se sente seguro(a) para abrir.

## Reatividade ao instrumento certo

Se o nutricionista MENCIONA o instrumento apropriado ao seu perfil (DEBQ para triar restrição/emoção/externo; EAT-26 para rastreio de TA; BES para compulsão; IES-2 para comer intuitivo; TFEQ-R18 para restrição cognitiva/desinibição/fome), e explica em linguagem acessível PARA VOCÊ (paciente) por que aquele instrumento faz sentido, o indicador "diagnóstico" sobe forte. Se ele improvisa recordatório alimentar sem estruturar avaliação comportamental, o indicador sobe pouco.

Se ele aplica instrumento ERRADO para o seu perfil (ex: quer TFEQ para rastrear TA — TFEQ não faz isso; usa EAT-26 num paciente sem sinal de risco quando o pertinente era DEBQ), você não sabe corrigir tecnicamente, mas o feedback pedagógico do turno registra o erro.

# REGRA DA DOSAGEM DE INFORMAÇÃO

Você só revela informação sobre você (dor real, contexto, história) quando o nutricionista PERGUNTA ESPECIFICAMENTE ou faz REFLEXÃO CERTA que abre. Se ele não pergunta, você não conta. Paciente na primeira consulta não voluntaria informação sensível — é tarefa do nutricionista extrair com escuta.

Exceção: no turno 1 (abertura), você dá o contexto inicial da sua queixa declarada — quem é você, por que veio, e um esboço do problema. MAS a dor real e a história pesada só saem se ele escutar bem.

Você é o paciente. NÃO invente coisas que o nutricionista não disse, nem corrige a fala dele, nem completa argumentos por ele.

Exemplo do que NÃO fazer:
- Nutricionista: "E como é seu dia?"

# PLAYBOOK M01 NUTRIÇÃO COMPORTAMENTAL — REFERÊNCIA PARA AVALIAÇÃO

Você usa este playbook como FONTE DA VERDADE para avaliar o nutricionista. Tudo o que ele diz é checado contra isto.

## POSICIONAMENTO DO CAMPO (T01)

Nutrição comportamental é abordagem que integra fisiológico, emocional, social e cultural do comer. Foca em COMO, POR QUE, QUANDO e EM QUE CIRCUNSTÂNCIAS a pessoa come — não só no O QUÊ. Rejeita moralização de alimentos. Reconhece falência do modelo prescritivo (Mann et al., 2007) e dano do estigma de peso (Tomiyama et al., 2018; Bacon & Aphramor, 2011).

Não é anti-nutrição. É a aplicação do modelo biopsicossocial (Engel, 1977) ao cuidado nutricional.

## DETERMINANTES DO COMER (T02)

- **Fisiológicos:** leptina, grelina, cascata de saciedade, sistema homeostático × hedônico, reatividade a pistas (Boswell & Kober, 2016)
- **Emocionais:** modelo psicossomático, 5 vias de Macht (2008), comer emocional
- **Ambientais:** framework socioecológico (Story et al., 2008), ambiente obesogênico, ANGELO

**Fome fisiológica vs. emocional (competência-chave):**
| Aspecto | Fisiológica | Emocional |
|---|---|---|
| Instalação | Gradual | Súbita |
| Localização | Corpo (estômago, energia) | "Cabeça", urgência difusa |
| Especificidade | Aceita vários alimentos | Alimento específico |
| Saciação | Cessa com plenitude | Persiste após plenitude |
| Desfecho | Satisfação | Culpa |
| Gatilho | Tempo desde última refeição | Evento emocional / pista |

## COMER INTUITIVO E MINDFUL EATING (T03)

**Comer intuitivo (Tribole & Resch):** 10 princípios. IES-2 mede 4 dimensões: permissão incondicional, comer por razões físicas não emocionais, confiança em sinais internos, congruência corpo-alimento.

**Mindful eating (MB-EAT):** atenção plena aplicada ao comer. Programa Kristeller & Wolever para compulsão alimentar.

**Distinção:** comer intuitivo = estilo alimentar amplo; mindful eating = prática atencional.

**Evidência (leitura honesta):**
- Correlatos psicológicos: robusta (Linardon et al., 2021 — metaanálise). Mas 90% transversal — não estabelece causalidade.
- Peso: fraca e inconsistente. NÃO é método de emagrecimento.
- Desfechos psicológicos e compulsão: força maior.

**Cautelas:** insegurança alimentar, TA ATIVO (comer intuitivo pode ser prematuro em TA — cautela clínica).

## INSTRUMENTOS DE AVALIAÇÃO (T04)

| Instrumento | Mede | Perfil típico |
|---|---|---|
| **DEBQ** (van Strien) | Restrição / Emoção / Externo | Triagem inicial multidimensional |
| **TFEQ / TFEQ-R18/R21** (Stunkard & Messick; Karlsson) | Restrição cognitiva / Desinibição / Fome | Restrição + desinibição |
| **EAT-26** (Garner) | Rastreio de risco de TA | Suspeita de anorexia/bulimia |
| **BES / ECAP** (Gormally; Freitas) | Compulsão alimentar | Episódios compulsivos |
| **IES-2** (Tylka) | Comer intuitivo (4 dim.) | Monitoramento de progresso; NÃO em TA ativo |
| **MEQ** (Framson) | Mindful eating | Avaliar prática atencional |

**Regras críticas:**
- Rastreio (EAT-26, BES) ≠ diagnóstico. Diagnóstico de TA é MÉDICO/PSIQUIÁTRICO. Nutricionista rastreia e encaminha.
- Pontos de corte dependem da população de validação — versão brasileira, adulto, sexo.
- Autorrelato tem viés de desejabilidade social.
- Interpretação por perfil, não por escore único.

## CONSULTA COMPORTAMENTAL (T05)

**Espírito da EM (Miller & Rollnick):** Parceria, Aceitação, Compaixão, Evocação.

**OARS:**
- **O**pen questions (perguntas abertas) — "O que te trouxe aqui?" não "Você quer emagrecer?"
- **A**ffirmations — reconhecer forças concretas
- **R**eflective listening — reflexão simples (parafrasear) e complexa (arriscar significado subjacente). Entonação DESCENDENTE.
- **S**ummaries — sínteses periódicas

**Aliança terapêutica (Bordin):** vínculo afetivo + acordo sobre objetivos + acordo sobre tarefas. Preditor consistente de desfecho (Flückiger et al., 2018).

**Reflexo de correção (righting reflex):** impulso de "consertar" — dispara reactância. RECONHECER e SEGURAR.

**Estágios de mudança (Prochaska & DiClemente):**
- Pré-contemplação: nem cogita mudar. Não empurre plano — escute.
- Contemplação: ambivalência viva. Evoque prós e contras.
- Preparação: pronta para agir. Ajude a planejar.
- Ação: modificando comportamento. Sustente.
- Manutenção: prevenir recaída.
- Recaída: ESPERADA, não fracasso.

**Estrutura das fases:** Engajar (aliança) → Focar (agenda) → Evocar (discurso de mudança) → Planejar (metas pactuadas).

**Sequência para dar informação sem reactância:** Evocar-Oferecer-Evocar ("o que você já sabe?" → informação neutra com permissão → "o que faz sentido pra você?").

## O QUE NÃO FAZER — HARD FAIL

1. Moralizar alimento ("proibido", "lixo", "do mal") ou corpo
2. Culpabilizar ("falta de força de vontade", "descomprometido")
3. Prescrever dieta restritiva rígida como resposta comportamental
4. Ignorar sinal de TA sem encaminhamento à equipe

- **Sinal de TA:** psicólogo(a) com formação em TA + psiquiatra + médico(a). Nunca sozinho.

- **HAS/DM2 combinados:** integrar com médico(a) — não abrir mão de cuidado comportamental.

## POSTURA — RESUMO

A escuta é a tecnologia. A prescrição é ferramenta situacional. O paciente é especialista em si; você é especialista em comportamento alimentar e mudança. A dança é lado a lado, não de cima pra baixo.

  const archetypesByLevel = {
    junior: [1, 2, 3],

    senior: [4, 5, 6, 7]

    + 'Seed: ' + seed + ' (use para variações sutis dentro do arquétipo — sobrenome, empresa, mas mantendo a estrutura).';

  return { fixed: fixed, dynamic: dynamic };

const SIM_ID = 'saunut-m01-consulta-comportamental';

const appState = {
  schemaVersion: SCHEMA_VERSION,
  level: null,
  studentName: '',
  userName: null,
  turn: 0,
  indicators: {},
  history: [],
  turnLog: [],
  consultantsUsed: 0,
  seed: 0,
  archetypeId: null,
  sessionStartedAt: null,
  ended: false,
  hardFailed: false,
  sessionId: '',
  diagnosis: null,
  earlyTermination: null
};
window.appState = appState;

// Guard 1 (Lição 52): flag anti-reentrância em advanceTurn.
// Escopo de módulo — NÃO faz parte do appState (não persiste).
let _advanceTurnInFlight = false;

function generateSessionId() {
  const rand = Math.floor(Math.random() * 9000 + 1000);
  return 'CNS-' + rand;
}

function onCoreReady() {
  console.log('[A Consulta] === VERSAO: v1.4.0-init === (SAUNUT M01)');

  // Badge de versão visível
  try {
    const badge = document.createElement('div');
    badge.style.cssText = 'position:fixed;bottom:6px;right:6px;background:#0074C7;color:#fff;font-family:Montserrat,system-ui;font-size:10px;padding:3px 8px;border-radius:3px;z-index:99999;opacity:0.55;pointer-events:none;';
    badge.textContent = 'A Consulta v1.4.0-init';
    document.body.appendChild(badge);
  } catch(e) {}

  // 1. Daily block
  if (ActiveIA.daily.isBlocked(SIM_ID)) {
    showDailyBlock();
    return;
  }

  // 2. Sessão salva — schema versioning + sanity check (Guard 3, Lição 52)
  const saved = ActiveIA.session.load(SIM_ID);
  if (saved && saved.schemaVersion === SCHEMA_VERSION && !saved.ended && saved.turn > 0 && saved.level) {
    const totalTurnsConfig = SIMULATOR_CONFIG.levels[saved.level].turns;
    const maxAllowedTurn = totalTurnsConfig + 1;
    const turnLogCount = (saved.turnLog || []).length;

    if (saved.turn > maxAllowedTurn ||
        (turnLogCount > 0 && Math.abs(saved.turn - turnLogCount) > 1)) {
      console.error('[A Consulta] Estado corrompido em sessão salva. Descartando.');
      ActiveIA.session.clear(SIM_ID);
      ActiveIA.modal.show({
        eyebrow: 'SESSÃO RECUPERADA',
        title: 'Sua sessão anterior teve um problema técnico',
        body: 'Por segurança, vamos começar uma nova sessão.',
        actions: [{
          label: 'Começar nova sessão',
          primary: true,
          onClick: function() { location.reload(); }
        }]
      });
      return;
    }

    console.log('[A Consulta] Sessão salva encontrada — retomando.');
    Object.assign(appState, saved);
    resumeSession();
    return;
  }
  if (saved) {
    console.log('[A Consulta] Sessão antiga descartada (schema=' + (saved.schemaVersion || 'pre-v1.4') + '). Iniciando nova.');
    ActiveIA.session.clear(SIM_ID);
  }
  appState.schemaVersion = SCHEMA_VERSION;

  // 3. Registra callbacks globais
  ActiveIA.on('reset-session', function() {
    ActiveIA.modal.show({
      eyebrow: 'RECOMEÇAR',
      title: 'Recomeçar do zero?',
      body: 'Sua sessão atual será perdida.',
      actions: [
        { label: 'Cancelar' },
        {
          label: 'Sim, recomeçar',
          primary: true,
          onClick: function() {
            ActiveIA.session.clear(SIM_ID);
            location.reload();
          }
        }
      ]
    });
  });
  ActiveIA.on('new-session', function() {
    if (ActiveIA.daily.isBlocked(SIM_ID)) {
      showDailyBlock();
    } else {
      ActiveIA.session.clear(SIM_ID);
      location.reload();
    }
  });
  ActiveIA.on('export-report', function() {
    if (appState.diagnosis) exportReport(appState.diagnosis);
  });
  ActiveIA.on('share-linkedin', function() {
    if (appState.diagnosis) exportLinkedInCard(appState.diagnosis);
  });

  showBoot();
}

function showBoot() {
  const mc = SIMULATOR_CONFIG.microcopy.boot;
  ActiveIA.boot.render({
    eyebrow: mc.eyebrow,
    title: mc.title,
    subtitle: mc.subtitle,
    showResetBtn: false
  });
  setTimeout(showTutorial, 1800);
}

function showTutorial() {
  const slides = SIMULATOR_CONFIG.microcopy.tutorial.slides;
  ActiveIA.tutorial.render({
    slides: slides,
    onFinish: showNameScreen
  });
}

function showNameScreen() {
  const mc = SIMULATOR_CONFIG.microcopy.namescreen;
  ActiveIA.namescreen.render({
    eyebrow: mc.eyebrow,
    prompt: mc.prompt,
    subtitle: mc.subtitle,
    placeholder: mc.placeholder,
    onConfirm: function(name) {
      appState.studentName = name;
      appState.userName = name;
      showLevelScreen();
    },
    onBack: showTutorial
  });
}

function showLevelScreen() {
  const mc = SIMULATOR_CONFIG.microcopy.levelscreen;
  const lvls = SIMULATOR_CONFIG.levels;

  ActiveIA.levelscreen.render({
    eyebrow: mc.eyebrow,
    title: mc.title,
    subtitle: mc.subtitle,
    cards: {
      junior: {
        num: '01',
        label: 'JÚNIOR',
        name: 'Paciente com perfil claro',
        turns: lvls.junior.turns + ' cenas',
        desc: lvls.junior.description
      },
      pleno: {
        num: '02',
        label: 'PLENO',
        name: 'Paciente misto',
        turns: lvls.pleno.turns + ' cenas',
        desc: lvls.pleno.description
      },
      senior: {
        num: '03',
        label: 'SÊNIOR',
        name: 'Paciente com sinais de risco',
        turns: lvls.senior.turns + ' cenas',
        desc: lvls.senior.description
      }
    },
    onSelect: function(lvlId) {
      startSession(lvlId);
    }

function showDailyBlock() {
  const mc = SIMULATOR_CONFIG.microcopy.dailyblock;
  ActiveIA.dailyblock.render({
    eyebrow: mc.eyebrow,
    title: mc.title,
    subtitle: mc.body
  });
}


// ============================================================================
// A CONSULTA — TURN ENGINE
// ============================================================================

function startSession(lvlId) {
  appState.level = lvlId;
  appState.turn = 0;
  appState.indicators = {};
  SIMULATOR_CONFIG.indicators.forEach(function(ind) {
    appState.indicators[ind.id] = ind.initial;
  });
  appState.history = [];
  appState.turnLog = [];
  appState.consultantsUsed = 0;
  appState.seed = Math.floor(Math.random() * 1000000);
  appState.archetypeId = null;
  appState.sessionStartedAt = new Date().toISOString();
  appState.ended = false;
  appState.hardFailed = false;
  appState.sessionId = generateSessionId();
  appState.diagnosis = null;
  appState.schemaVersion = SCHEMA_VERSION;
  appState.earlyTermination = null;

  ActiveIA.session.save(SIM_ID, appState);
  advanceTurn(null);
}

async function advanceTurn(userText) {
  // Guard 1 (Lição 52): reentrância — anti-clique-duplo
  if (_advanceTurnInFlight) {
    console.warn('[A Consulta] advanceTurn já em andamento — ignorando chamada concorrente.');
    return;
  }

  // Guard 2 (Lição 52): validação anti-vazamento de JSON da IA como userText
  if (userText) {
    const trimmed = userText.trim();
    const looksLikeAIJSON = /^\s*[{\[]/.test(trimmed) &&
      /"narrative"\s*:|"indicators"\s*:|"should_end"\s*:/.test(trimmed);
    if (looksLikeAIJSON) {
      console.error('[A Consulta] Entrada do nutricionista parece JSON da IA — BLOQUEADO.');
      ActiveIA.modal.show({
        eyebrow: 'ENTRADA INVÁLIDA',
        title: 'Sua resposta não foi compreendida',
        body: 'Algo estranho aconteceu com o formato da sua resposta. Por segurança, reiniciamos a sessão.',
        actions: [{
          label: 'Reiniciar sessão',
          primary: true,
          onClick: function() {
            ActiveIA.session.clear(SIM_ID);
            location.reload();
          }
        }]
      });
      return;
    }
  }

  // Guard 3 (Lição 52): limite duro de appState.turn
  const totalTurnsConfig = SIMULATOR_CONFIG.levels[appState.level] ? SIMULATOR_CONFIG.levels[appState.level].turns : 4;
  const maxAllowedTurn = totalTurnsConfig + 1;
  if (appState.turn >= maxAllowedTurn) {
    console.error('[A Consulta] appState.turn (' + appState.turn + ') excedeu o máximo (' + maxAllowedTurn + '). Forçando encerramento.');
    if (!appState.ended) {
      appState.ended = true;
      ActiveIA.session.save(SIM_ID, appState);
      showEpilogueModal();
    }
    return;
  }

  _advanceTurnInFlight = true;

  try {
    appState.turn += 1;

    ActiveIA.loading.show('A paciente está pensando…');

    if (userText) {
      const totalTurns = SIMULATOR_CONFIG.levels[appState.level].turns;
      const responseNum = appState.turn - 1;
      const responsesRemaining = totalTurns - responseNum;

      let turnMarker;
      if (responseNum < totalTurns) {
        turnMarker = '\n\n[META: Esta é a resposta ' + responseNum + ' de ' + totalTurns + ' do NUTRICIONISTA. Faltam ' + responsesRemaining + ' resposta(s). NÃO encerre agora — gere a próxima cena normalmente, deixe should_end: false. A cena de encerramento da consulta só vem após a resposta ' + totalTurns + '.]';
      } else {
        turnMarker = '\n\n[META: Esta é a RESPOSTA FINAL do NUTRICIONISTA (' + totalTurns + ' de ' + totalTurns + '). Esta é a cena de DESFECHO — a paciente aceitando o encaminhamento, agendando retorno, saindo em silêncio, o que for coerente com o arquétipo. Gere uma narrativa COMPLETA de fechamento. should_end: true.]';
      }

      appState.history.push({
        role: 'user',
        content: userText + turnMarker
      });
    }

    const response = await requestAITurn();
    handleAIResponse(response);
  } catch (err) {
    console.error('[A Consulta] Erro na chamada da IA:', err);
    ActiveIA.loading.hide();
    ActiveIA.modal.show({
      eyebrow: 'ERRO',
      title: 'Houve um erro na chamada',
      body: 'Detalhes: ' + (err && err.message ? err.message : 'desconhecido') + '. Você pode tentar responder novamente.',
      actions: [{ label: 'Ok', primary: true }]
    });
    appState.turn -= 1;
  } finally {
    _advanceTurnInFlight = false;
  }
}

async function requestAITurn() {
  const messages = appState.history.slice();
  if (messages.length === 0) {
    messages.push({
      role: 'user',
      content: '[Início da sessão. Apresente o paciente com sua fala de abertura da consulta. Este é o turno 1 — a abertura, antes de qualquer resposta do nutricionista.]'
    });
  }

  const sp = buildSystemPrompt();
  const response = await ActiveIA.callAPI({
    systemFixed: sp.fixed,
    systemDynamic: sp.dynamic,
    messages: messages,
    maxTokens: 2500,
    config: SIMULATOR_CONFIG    // v1.4.0 — ativa guard preventivo de conduta
  });

  return response;
}

function handleAIResponse(response) {
  const parsed = response.parsed;
  if (!parsed) {
    console.error('[A Consulta] Resposta da IA não parseada:', response);
    ActiveIA.loading.hide();
    ActiveIA.modal.show({
      eyebrow: 'ERRO',
      title: 'Não consegui interpretar a resposta',
      body: 'Você pode tentar responder novamente.',
      actions: [{ label: 'Ok', primary: true }]
    });
    appState.turn -= 1;
    return;
  }

  // Atualiza indicadores (acumulativos)
  if (parsed.indicators) {
    Object.keys(parsed.indicators).forEach(function(key) {
      appState.indicators[key] = parsed.indicators[key];
    });
  }

  // Registra no turnLog
  appState.turnLog.push({
    turn: appState.turn,
    userResponse: appState.history[appState.history.length - 1] ? appState.history[appState.history.length - 1].content : null,
    assistantNarrative: parsed.narrative || '',
    feedback: parsed.feedback || '',
    articulation_class: parsed.articulation_class || 'parcial',
    indicators_snapshot: Object.assign({}, appState.indicators),
    case_state: parsed.case_state || {},
    patient_pills: parsed.patient_pills || [],
    phase: parsed.phase_next || 'engajar',
    scene_eyebrow: parsed.scene_eyebrow || ('T' + appState.turn)
  });

  // Registra a fala da IA no histórico (JSON serializado — Guard 2 protege
  // contra este JSON vazar como userText num próximo turno)
  appState.history.push({
    role: 'assistant',
    content: JSON.stringify(parsed)
  });

  ActiveIA.session.save(SIM_ID, appState);
  ActiveIA.loading.hide();

  // ============================================================
  // ENCERRAMENTO — ORDEM DETERMINÍSTICA (Lição 45)
  // Regra 0 (risco ≤10) → Regra 1 (hard fail global) → turno final natural
  // ============================================================
  const totalTurns = SIMULATOR_CONFIG.levels[appState.level].turns;
  const userResponseCount = appState.turn - 1;
  const isLastTurn = userResponseCount >= totalTurns;
  const isHardFail = parsed.should_end && parsed.hard_fail === true;

  // Regra 0 — indicador de risco (escopo começa em 100, cai com decisões que erodem escopo)
  const scopeValue = appState.indicators.escopo;
  const isRiskCollapse = (typeof scopeValue === 'number' && scopeValue <= 10);

  if (isHardFail || isRiskCollapse) {
    appState.ended = true;
    appState.hardFailed = true;
    appState.earlyTermination = isHardFail
      ? { reason: 'rule1', message: 'Hard fail — quebra de regra de integridade profissional.' }
      : { reason: 'rule0', message: 'Encerramento por deterioração do escopo profissional (indicador de risco).' };
    ActiveIA.session.save(SIM_ID, appState);
    renderGamescreen(parsed);
    setTimeout(showEpilogueModal, 800);
  } else if (isLastTurn) {
    appState.ended = true;
    appState.hardFailed = false;
    ActiveIA.session.save(SIM_ID, appState);
    renderGamescreen(parsed);
    // Cena final SEM modal automático — troca o botão para "Avançar para o dossiê"
    setTimeout(function() {
      const submitBtn = document.querySelector('[data-aia-action="submit-response"]');
      if (submitBtn) {
        submitBtn.textContent = 'Avançar para o dossiê →';
        submitBtn.onclick = function() { showEpilogueModal(); };
        submitBtn.disabled = false;
      }
      const textarea = document.getElementById('response-textarea');
      if (textarea) {
        textarea.style.display = 'none';
      }
      const hints = document.querySelectorAll('.hint-bar, .input-hint');
      hints.forEach(function(h) { h.style.display = 'none'; });
    }, 100);
  } else {
    // Ignora should_end da IA em turnos intermediários (Lição 45)
    if (parsed.should_end === true) {
      console.warn('[A Consulta] IA tentou encerrar prematuramente no turno ' + appState.turn + ' (resposta ' + userResponseCount + ' de ' + totalTurns + '). Ignorado pelo JS.');
    }
    renderGamescreen(parsed);
  }
}

function resumeSession() {
  const lastLog = appState.turnLog[appState.turnLog.length - 1];
  if (!lastLog) {
    startSession(appState.level);
    return;
  }

  const fakeParsed = {
    narrative: lastLog.assistantNarrative,
    feedback: '',
    patient_pills: lastLog.patient_pills,
    indicators: lastLog.indicators_snapshot,
    case_state: lastLog.case_state,
    phase_next: lastLog.phase
  };

  renderGamescreen(fakeParsed);
}


// ============================================================================
// A CONSULTA — RENDER DA GAMESCREEN
// ============================================================================

function renderGamescreen(parsed) {
  const config = SIMULATOR_CONFIG;
  const level = appState.level;
  const totalTurns = config.levels[level].turns;
  const lvlObj = config.levels[level];
  const mc = config.microcopy.scene;

  const prevTurn = appState.turnLog[appState.turnLog.length - 2];
  const activeScene = {
    eyebrow: 'CENA ' + String(appState.turn).padStart(2, '0'),
    narrative: parsed.narrative || '',
    feedback: (prevTurn && prevTurn.feedback) ? {
      classification: prevTurn.articulation_class || 'parcial',
      leadIn: 'Avaliação da sua última fala',
      body: prevTurn.feedback
    } : null
  };

  const pillStrip = (parsed.patient_pills || []).map(function(p) {
    return {
      label: p.label,
      value: '',
      modifier: p.tone === 'danger' ? 'alert' : (p.tone === 'warning' ? 'warning' : '')
    };
  });

  const consultantLimit = lvlObj.consultantLimit || 0;
  const consultantsRemaining = consultantLimit - appState.consultantsUsed;
  const sections = [
    {
      title: 'INDICADORES',
      type: 'indicators',
      data: config.indicators.map(function(ind) {
        return {
          name: ind.name,
          value: Math.round(appState.indicators[ind.id] || 0)
        };
      })
    }
  ];

  if (consultantLimit > 0) {
    sections.push({
      title: 'CONSULTOR',
      type: 'consultants',
      list: config.consultants.map(function(c) {
        return {
          name: c.name,
          role: c.role,
          disabled: consultantsRemaining <= 0
        };
      }),
      counter: consultantsRemaining + ' uso(s) restante(s)'
    });
  }

  const sidePanel = { sections: sections };

  const phaseObj = config.phases.find(function(p) { return p.id === (parsed.phase_next || 'engajar'); });
  const phaseName = phaseObj ? phaseObj.name : '';
  const sceneNumber = appState.turn;
  const totalScenes = totalTurns + 1;

  ActiveIA.scene.render({
    topbar: {
      mark: 'ACTIVE IA',
      title: config.title,
      phase: phaseName,
      student: appState.studentName,
      connectionStatus: 'connected'
    },
    monument: {
      eyebrow: 'CENA',
      turnNumber: sceneNumber,
      totalTurns: totalScenes,
      phaseLabel: phaseName
    },
    pillStrip: pillStrip,
    scene: activeScene,
    hint: {
      strong: mc.hintArticulation.strong,
      body: mc.hintArticulation.body
    },
    submit: {
      placeholder: mc.placeholder,
      submitLabel: mc.submitLabel,
      hint: mc.hint,
      showSaveDraft: false
    },
    sidePanel: sidePanel,
    onSubmit: function() {
      const textarea = document.getElementById('response-textarea');
      const text = textarea ? textarea.value.trim() : '';
      if (text.length < 1) return;
      advanceTurn(text);
    },
    onConsult: function(idx) {
      const consultant = config.consultants[idx];
      if (consultant && appState.consultantsUsed < consultantLimit) {
        requestConsultant(consultant);
      }
    }
  });
}

// ============================================================================
// CONSULTOR
// ============================================================================
function requestConsultant(consultant) {
  const gameContext = {
    moduleTitle: SIMULATOR_CONFIG.title,
    studentName: appState.studentName,
    level: SIMULATOR_CONFIG.levels[appState.level].label,
    turnsTotal: SIMULATOR_CONFIG.levels[appState.level].turns,
    currentTurn: appState.turn,
    archetypeId: appState.archetypeId,
    history: appState.turnLog.map(function(t) {
      return {
        turn: t.turn,
        userResponse: t.userResponse,
        assistantNarrative: t.assistantNarrative
      };
    })
  };

  ActiveIA.consultant.open({
    consultant: consultant,
    gameContext: gameContext,
    onUsed: function() {
      appState.consultantsUsed += 1;
      ActiveIA.session.save(SIM_ID, appState);
    },
    onError: function(err) {
      console.error('[A Consulta] Erro consultor:', err);
    }
  });
}


// ============================================================================
// A CONSULTA — EPÍLOGO, DOSSIÊ, EXPORT
// ============================================================================

function showEpilogueModal() {
  const mc = SIMULATOR_CONFIG.microcopy.epilogue;
  const isHardFail = appState.hardFailed;

  ActiveIA.modal.show({
    eyebrow: 'A CONSULTA',
    title: isHardFail ? mc.hardFailTitle : mc.title,
    body: isHardFail ? mc.hardFailBody : mc.body,
    actions: [
      {
        label: 'Avançar para o dossiê →',
        primary: true,
        onClick: function() {
          finishSession();
        }
      }
    ]
  });
}

async function finishSession() {
  ActiveIA.loading.show('Gerando seu dossiê…');

  appState.userName = appState.studentName;

  const sp = buildSystemPrompt();
  const conceptIds = SIMULATOR_CONFIG.concepts.map(function(c) { return c.id; });
  const conceptSchemaLines = conceptIds.map(function(id) {
    return '    "' + id + '": "demonstrado|parcialmente_demonstrado|nao_demonstrado"';
  }).join(',\n');

  const finalAnalysisPrompt = 'A sessão terminou. '
    + (appState.hardFailed ? 'Foi um hard fail (nutricionista quebrou uma regra profissional / deterioração de escopo).' : 'Foi um fim natural — completou os turnos.')
    + '\n\nGere agora a ANÁLISE FINAL ESTRUTURADA. Retorne JSON estrito com este formato:\n\n'
    + '{\n'
    + '  "diagnosis_summary": "Resumo de 2-3 frases da condução.",\n'
    + '  "concept_map": {\n'
    + conceptSchemaLines + '\n'
    + '  },\n'
    + '  "concept_justifications": { ... mesma estrutura de IDs, com 1-2 frases de justificativa cada. Para conceitos não testáveis pelo arquétipo jogado, use "nao_demonstrado" + justificativa "Não testado por ausência de contexto neste arquétipo" (Lição 38 — NUNCA colocar como ponto a revisitar). },\n'
    + '  "strengths": [{ "turn": N, "description": "MÁXIMO 8 PALAVRAS — sem qualificadores como \'sistematicamente\', \'com precisão técnica\', etc." }],\n'
    + '  "weaknesses": [{ "turn": N, "description": "1-2 frases apontando o que ficou aquém — SOMENTE de turnos com articulation_class plena/parcial/fraca, NUNCA indeterminada." }],\n'
    + '  "next_step_recommendation": { "action": "subir_nivel|repetir_nivel|voltar_nivel|revisar_modulo", "rationale": "..." },\n'
    + '  "headline_metric": "Frase curta resumindo desempenho",\n'
    + '  "linkedin_card": { "challenge": "...", "skills_demonstrated": ["...","..."] }\n'
    + '}\n\n'
    + 'Use APENAS os ' + conceptIds.length + ' IDs listados de concept_map. Weaknesses SOMENTE do arquétipo jogado — conceitos que só existiriam em outros arquétipos vão no concept_map como "nao_demonstrado" com justificativa clara, NUNCA nas weaknesses.';

  try {
    const response = await ActiveIA.callAPI({
      systemFixed: sp.fixed,
      systemDynamic: sp.dynamic,
      messages: appState.history.concat([{ role: 'user', content: finalAnalysisPrompt }]),
      maxTokens: 4000,
      config: SIMULATOR_CONFIG
    });

    const diagnosis = response.parsed;
    if (!diagnosis) {
      throw new Error('Análise final vazia');
    }

    appState.diagnosis = diagnosis;
    ActiveIA.session.save(SIM_ID, appState);

    ActiveIA.daily.markComplete(SIM_ID);

    ActiveIA.loading.hide();
    renderDossier(diagnosis);
  } catch (err) {
    console.error('[A Consulta] Erro gerando dossiê:', err);
    ActiveIA.loading.hide();
    ActiveIA.modal.show({
      eyebrow: 'ERRO',
      title: 'Houve um erro gerando o dossiê',
      body: 'Detalhes: ' + (err && err.message ? err.message : 'desconhecido'),
      actions: [{ label: 'Ok', primary: true }]
    });
  }
}

function renderDossier(diagnosis) {
  const config = SIMULATOR_CONFIG;
  const userName = (appState.userName || appState.studentName || 'Nutricionista').trim();
  const nameParts = userName.split(/\s+/);
  const firstName = nameParts[0] || userName;
  const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';

  const levelLabel = config.levels[appState.level].label;
  const respondedTurns = appState.turnLog.filter(function(t) { return t.userResponse; });
  const turnsPlayed = respondedTurns.length;

  let subtitle = 'Concluiu a simulação no nível <strong style="color:#fff;">' + levelLabel + '</strong> · '
    + turnsPlayed + ' ' + (turnsPlayed === 1 ? 'turno' : 'turnos') + '.';
  if (appState.hardFailed) {
    subtitle = 'Sessão encerrada por quebra de regra profissional ou deterioração do escopo.';
  }

  const articulationDone = respondedTurns.filter(function(t) { return t.articulation_class === 'plena'; }).length;
  const articulationTotal = turnsPlayed;
  const conceptsTotal = config.concepts.length;
  const conceptsMastered = diagnosis.concept_map
    ? Object.values(diagnosis.concept_map).filter(function(s) { return s === 'demonstrado'; }).length
    : 0;

  const recLabels = {
    subir_nivel: levelLabel === 'Júnior' ? 'Avançar para o nível Pleno' :
                 levelLabel === 'Pleno' ? 'Avançar para o nível Sênior' :
                 'Manter Sênior — repetir com novo paciente',
    repetir_nivel: 'Repetir ' + levelLabel + ' — consolidar antes de avançar',
    voltar_nivel: levelLabel === 'Sênior' ? 'Voltar ao Pleno' :
                  levelLabel === 'Pleno' ? 'Voltar ao Júnior' :
                  'Revisar fundamentos antes de novo paciente',
    revisar_modulo: 'Revisar o M01 antes de novo paciente'
  };
  const rec = diagnosis.next_step_recommendation || {};
  const recActionLabel = recLabels[rec.action] || ('Repetir ' + levelLabel);

  const dossierData = {
    sessionId: 'CNS-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.floor(Math.random()*9000+1000),
    firstName: firstName,
    lastName: lastName,
    subtitle: subtitle,
    headlineGrid: [
      { label: 'ARTICULAÇÃO', value: String(articulationDone), max: String(articulationTotal), sub: 'Turnos com articulação plena' },
      { label: 'CONCEITOS DEMONSTRADOS', value: String(conceptsMastered), max: String(conceptsTotal), sub: 'Do M01 SAUNUT' },
      { label: 'PRÓXIMO PASSO', valueText: recActionLabel, sub: rec.rationale ? rec.rationale.split('.')[0] + '.' : '' }
    ],
    indicators: config.indicators.map(function(ind) {
      return {
        name: ind.name,
        value: Math.round(appState.indicators[ind.id] || 0),
        max: 100
      };
    }),
    conceptMap: config.concepts.map(function(c) {
      const status = (diagnosis.concept_map && diagnosis.concept_map[c.id]) || 'nao_demonstrado';
      const justification = (diagnosis.concept_justifications && diagnosis.concept_justifications[c.id]) || '';
      return {
        name: c.name,
        reference: c.module_ref,
        module_ref: c.module_ref,
        status: status,
        justification: justification
      };
    }),
    strengths: (diagnosis.strengths || []).map(function(s) {
      return {
        turn: s.turn,
        label: 'TURNO ' + String(s.turn).padStart(2, '0'),
        description: s.description
      };
    }),
    weaknesses: (diagnosis.weaknesses || []).map(function(w) {
      return {
        turn: w.turn,
        label: 'TURNO ' + String(w.turn).padStart(2, '0'),
        description: w.description
      };
    }),
    recommendation: {
      action: recActionLabel,
      rationale: rec.rationale || ''
    }
  };

  ActiveIA.dossier.render(dossierData, {});
}

function exportReport(diagnosis) {
  appState.userName = appState.studentName;
  ActiveIA.export.fullReport(appState, diagnosis, SIMULATOR_CONFIG);
}

function exportLinkedInCard(diagnosis) {
  appState.userName = appState.studentName;
  if (typeof ActiveIA.export.shareLinkedInModal === 'function') {
    ActiveIA.export.shareLinkedInModal(appState, diagnosis, SIMULATOR_CONFIG);
  } else if (typeof ActiveIA.export.linkedinCard === 'function') {
    ActiveIA.export.linkedinCard(appState, diagnosis, SIMULATOR_CONFIG);
  } else {
    ActiveIA.modal.show({
      eyebrow: 'INDISPONÍVEL',
      title: 'Export LinkedIn não disponível',
      body: 'Este simulador está numa versão do core que não expõe o export do LinkedIn.',
      actions: [{ label: 'Ok', primary: true }]
    });
  }
}


// Inicialização
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function() {
    ActiveIA.init(SIMULATOR_CONFIG).then(function() {
      // onCoreReady é chamado pelo core via window.onCoreReady
    }).catch(function(err) {
      console.error('[A Consulta] Falha ao inicializar core:', err);
    });
  });
} else {
  ActiveIA.init(SIMULATOR_CONFIG).then(function() {
    // idem
  }).catch(function(err) {
    console.error('[A Consulta] Falha ao inicializar core:', err);
  });
}

window.onCoreReady = onCoreReady;
</script>
